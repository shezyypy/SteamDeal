[alembic]
script_location = app/db/migrations
prepend_sys_path = .

# sqlalchemy.url НЕ задаётся здесь намеренно — реальный DATABASE_URL подставляется
# в migrations/env.py из app.config.settings (т.е. из .env). Так секрет не лежит в двух местах.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
