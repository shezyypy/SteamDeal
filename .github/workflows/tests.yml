name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SteamSaleBot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Compile Python sources
        run: python -m compileall -q app webapp scripts main.py worker.py run_all.py

      - name: Validate migration graph
        run: alembic heads

      - name: Check frontend syntax
        run: node --check webapp/static/app.js

      - name: Scan tracked files for secrets
        run: python scripts/check_secrets.py
